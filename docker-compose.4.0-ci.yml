# 4.0 联调最小栈：Redis + AI 服务
# 用法：
#   docker compose -f docker-compose.4.0-ci.yml up -d
#   ./scripts/ctl.sh start media
#   ./scripts/ctl.sh start api

services:
  redis:
    image: redis:7-alpine
    container_name: pallas-ai-ci-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
