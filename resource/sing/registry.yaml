# SVC 模型后端注册表
# ─────────────────────────────────────────────────────────────
# 加新模型族(如 RVC、DDSP-4)只需在 `backends` 加一段,然后把名字加到
# `fallback_order` 末尾。无需改 Python 代码,无需改 svc_inference.py。
#
# DDSP 多版本：PallasBot/DDSP-SVC 用分支区分（6.1 / 6.2 / 6.3）。
# 仓内默认只挂一份子模块 → app/workers/sing/DDSP-SVC（branch=6.2）。
# 要启用 6.3 / 6.1 时另挂子模块（见 docs 或下方注释）；脚本不存在会自动跳过。
# 注意：6.2+ 与旧 checkpoint 不兼容，同名 pallas.pt 不能指望跨版本通吃。
# 推理前会按权重里 input_projection 维度跳过不兼容版本（Conv1d→6.1/6.2，Linear→6.3）。

# 字段说明:
#   script:         子模块入口 .py(相对项目根)
#   arg_style:      CLI 参数风格,当前支持 ddsp / sovits
#   model_glob:     在 speaker_dir 下找模型文件的 glob 模式
#   required_files: 判定该 backend 适用于某个 speaker 必须存在的文件
#   extra_args:     每次调用都要追加的固定参数(如开浅扩散)
#   output_suffix:  输出文件名后缀,用于区分不同 backend 的产物
#   enabled:        false 可临时下线某个 backend

backends:
  # ── DDSP-SVC 系列（CLI 一致；按目录/分支区分版本）──
  # 补充 6.3：
  #   git submodule add -b 6.3 https://github.com/PallasBot/DDSP-SVC.git app/workers/sing/DDSP-SVC-6.3
  ddsp_6.3:
    script: app/workers/sing/DDSP-SVC-6.3/main_reflow.py
    arg_style: ddsp
    model_glob: "*.pt"
    required_files: []
    extra_args: []
    output_suffix: "_ddsp"
    output_format: "flac"
    enabled: true

  # 默认子模块：.gitmodules → app/workers/sing/DDSP-SVC（branch=6.2）
  ddsp_6.2:
    script: app/workers/sing/DDSP-SVC/main_reflow.py
    arg_style: ddsp
    model_glob: "*.pt"
    required_files: []
    extra_args: []
    output_suffix: "_ddsp"
    output_format: "flac"
    enabled: true

  # 补充 6.1：
  #   git submodule add -b 6.1 https://github.com/PallasBot/DDSP-SVC.git app/workers/sing/DDSP-SVC-6.1
  ddsp_6.1:
    script: app/workers/sing/DDSP-SVC-6.1/main_reflow.py
    arg_style: ddsp
    model_glob: "*.pt"
    required_files: []
    extra_args: []
    output_suffix: "_ddsp"
    output_format: "flac"
    enabled: true

  # ── SoVITS 系列(若 DDSP 全失败,降级到 SoVITS；需对应子模块与 G_*.pth) ──
  sovits_4.1:
    script: app/workers/sing/so_vits_svc_41/inference_main.py
    arg_style: sovits
    model_glob: "G_*.pth"
    required_files: ["config.json"]
    extra_args: []
    output_suffix: "_sovits"
    output_format: "flac"
    enabled: true

  sovits_4.0:
    script: app/workers/sing/so_vits_svc/inference_main.py
    arg_style: sovits
    model_glob: "G_*.pth"
    required_files: ["config.json"]
    extra_args: []
    output_suffix: "_sovits"
    output_format: "flac"
    enabled: true

  # ── RVC（社区 .pth + 可选 .index；薄 CLI → 子模块 RVC WebUI infer 栈）──
  # 子模块：app/workers/sing/RVC
  # 资产：resource/sing/models/pretrain/rvc/{hubert_base/,rmvpe.pt}
  rvc:
    script: app/workers/sing/rvc_launcher/infer_rvc.py
    arg_style: rvc
    model_glob: "*.pth"
    required_files: []
    extra_args: []
    output_suffix: "_rvc"
    output_format: "flac"
    enabled: true

# 回退顺序:前面的优先尝试,失败自动切到下一个
# 官方 pallas.pt 是 6.1/6.2（Conv1d）；6.3（Linear）放后面，避免默认先白跑 ~40s 再 mismatch
# 未克隆的目录会被 compatible_backends 跳过，不会报「文件不存在」刷屏
# RVC 仅在 speaker 目录存在 *.pth 时命中（与 DDSP 的 *.pt 分流）
fallback_order:
  - ddsp_6.2
  - ddsp_6.1
  - ddsp_6.3
  - rvc
  - sovits_4.1
  - sovits_4.0
